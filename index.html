<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
          font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #a78bfa 0%, #c084fc 50%, #9333ea 100%);
            min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
    }

    body::before {
        content: "";
        position: absolute;
        width: 500px;
        height: 500px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 50%;
        left: -150px;
        bottom: -180px;
    }

    body::after {
        content: "";
        position: absolute;
        width: 400px;
        height: 400px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 50%;
        right: -150px;
        top: -100px;
    }

    .login-container {
        width: 850px;
        max-width: 90%;
        min-height: 500px;
        background: white;
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        position: relative;
        z-index: 2;
        box-shadow: 0 15px 40px rgba(55, 35, 100, 0.25);
    }

    .welcome {
        width: 55%;
        background: linear-gradient(145deg, #7450bd, #6542a8);
        color: white;
        padding: 70px 55px;
        position: relative;
        overflow: hidden;
    }

    .welcome h1 {
        font-size: 30px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .welcome p {
        font-size: 14px;
        line-height: 1.6;
        max-width: 280px;
        color: #eee7ff;
    }

    .circle {
        position: absolute;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 50%;
    }

    .circle-1 {
        width: 180px;
        height: 180px;
        left: -90px;
        top: -40px;
    }

    .circle-2 {
        width: 220px;
        height: 220px;
        right: -100px;
        bottom: -80px;
    }

    .circle-3 {
        width: 140px;
        height: 140px;
        right: -60px;
        bottom: -30px;
    }

    .plus {
        position: absolute;
        color: rgba(255, 255, 255, 0.7);
        font-size: 20px;
    }

    .plus-1 {
        top: 30px;
        left: 70px;
    }

    .plus-2 {
        bottom: 60px;
        left: 110px;
    }

    .plus-3 {
        top: 100px;
        right: 70px;
    }

    .dots {
        position: absolute;
        top: 35px;
        right: 30px;
        width: 40px;
        height: 50px;
        background-image: radial-gradient(
            white 1px,
            transparent 1px
        );
        background-size: 7px 7px;
        opacity: 0.7;
    }

    .login-form {
        width: 45%;
        padding: 70px 45px;
        background: #fff;
    }

    .login-form h2 {
        font-size: 25px;
        font-weight: bold;
        color: #555;
        margin-bottom: 25px;
    }

    .input-group {
        margin-bottom: 15px;
    }

    .input-group-text {
        background: white;
        border-right: none;
        color: #aaa;
        border-color: #e6e6e6;
    }

    .form-control {
        border-left: none;
        border-color: #e6e6e6;
        height: 42px;
        font-size: 13px;
    }

    .form-control:focus {
        box-shadow: none;
        border-color: #8a65c8;
    }

    .input-group:focus-within .input-group-text {
        border-color: #8a65c8;
        color: #7650b9;
    }

    .options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 10px;
        color: #777;
        margin: 10px 0 20px;
    }

    .options a {
        color: #777;
        text-decoration: none;
    }

    .options a:hover {
        color: #704bb4;
    }

    .btn-login {
        width: 100%;
        height: 40px;
        border: none;
        border-radius: 20px;
        background: linear-gradient(90deg, #7049b8, #865ec7);
        color: white;
        font-size: 13px;
        transition: 0.3s;
    }

    .btn-login:hover {
        background: linear-gradient(90deg, #603ba3, #754db6);
        transform: translateY(-1px);
    }

    .register {
        text-align: center;
        margin-top: 25px;
        font-size: 10px;
        color: #777;
    }

    .register a {
        color: #7049b8;
        text-decoration: none;
        font-weight: bold;
    }

    @media (max-width: 768px) {

        body {
            overflow: auto;
            padding: 30px 0;
        }

        .login-container {
            flex-direction: column;
            max-width: 90%;
        }

        .welcome {
            width: 100%;
            min-height: 230px;
            padding: 45px 35px;
        }

        .login-form {
            width: 100%;
            padding: 45px 35px;
        }
    }

    @media (max-width: 450px) {

        .welcome h1 {
            font-size: 25px;
        }

        .login-form {
            padding: 35px 25px;
        }
    }
</style>

</head>

<body>

<div class="login-container">

    <!-- LADO ESQUERDO -->
    <div class="welcome">

        <div class="dots"></div>

        <span class="plus plus-1">+</span>
        <span class="plus plus-2">+</span>
        <span class="plus plus-3">+</span>

        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>

        <h1>Bem vindo a PRATICU!</h1>

        <p>
            Você pode fazer o acesso com
            sua conta existente.
        </p>

    </div>

    <!-- LADO DIREITO -->
    <div class="login-form">

        <h2>Entrar</h2>

        <form id="formLogin">

            <!-- E-MAIL -->
            <div class="input-group">
                <span class="input-group-text">
                    <i class="bi bi-person"></i>
                </span>

                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="E-mail"
                    required>
            </div>

            <!-- SENHA -->
            <div class="input-group">
                <span class="input-group-text">
                    <i class="bi bi-lock"></i>
                </span>

                <input
                    type="password"
                    id="senha"
                    class="form-control"
                    placeholder="Senha"
                    required>
            </div>

            <!-- OPÇÕES -->
            <div class="options">

                <div>
                    <input type="checkbox" id="Lembrar-me">

                    <label for="Lembrar-me">
                        Lembrar-me
                    </label>
                </div>

                <a href="#">
                    Esqueceu sua senha?
                </a>

            </div>

            <!-- BOTÃO -->
            <button
                type="submit"
                class="btn-login">

                Entre aqui

            </button>

        </form>

        <!-- CADASTRO -->
        <div class="register">

            novo aqui?

            <a href="cadastro.html">
                Criar uma conta
            </a>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Validação do Login -->
<script>

    document.getElementById("formLogin").addEventListener("submit", function(event) {

        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const senha = document.getElementById("senha").value;

        // Recupera os usuários cadastrados
        let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

        // Verifica se o e-mail e a senha estão corretos
        const usuarioEncontrado = usuarios.find(function(usuario) {

            return usuario.email === email && usuario.senha === senha;

        });

        // Se não encontrar, permanece no login
        if (!usuarioEncontrado) {

            alert("E-mail ou senha incorretos!");

            return;

        }

        // Se encontrar, permite o acesso
        alert("Login realizado com sucesso!");

        window.location.href = "cat_logo_de_exerc_cios_interativo.html";

    });

</script>

</body>

</html>
